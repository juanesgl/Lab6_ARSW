# Levanta el frontend (este repositorio) junto al backend (repositorio independiente del Lab P2)
# y su base de datos PostgreSQL.
# El backend se construye directamente desde GitHub; para usar una copia local:
#   BACKEND_CONTEXT=../Lab_P2_BluePrints_Java21_API_Security_JWT docker compose up --build
services:
  web:
    build:
      context: .
      args:
        VITE_USE_MOCK: 'false'
    ports:
      - '5173:80'
    environment:
      BACKEND_URL: http://backend:8080
    depends_on:
      - backend

  backend:
    build: ${BACKEND_CONTEXT:-https://github.com/juanesgl/Lab_P2_BluePrints_Java21_API_Security_JWT.git#main}
    ports:
      - '8080:8080'
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/lab4_arsw
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-chefai?}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lab4_arsw
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chefai?}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d lab4_arsw']
      interval: 5s
      retries: 10
