# Levanta el frontend junto al backend (../back) y su base de datos PostgreSQL.
# El navegador habla STOMP directo con el backend en localhost:8080 (puerto publicado abajo).
# El servidor Socket.IO (../back-rt-socketio) no está en este compose: se levanta con `npm start`.
services:
  web:
    build:
      context: .
      args:
        VITE_USE_MOCK: 'false'
    ports:
      - '5173:80'
    environment:
      BACKEND_URL: http://backend:8080
    depends_on:
      - backend

  backend:
    build: ${BACKEND_CONTEXT:-../back}
    ports:
      - '8080:8080'
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/lab4_arsw
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-chefai?}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lab4_arsw
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chefai?}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d lab4_arsw']
      interval: 5s
      retries: 10
